name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: タグと Cargo.toml の版が一致するか確認
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "タグ $env:GITHUB_REF_NAME と Cargo.toml の版 $version が一致しません" }

      - run: cargo test --locked
      - run: cargo build --release --locked

      - run: cargo install zipsign --locked --version 0.2.2

      # self_update は名前に target を含む zip を探し、zipsign の署名を検証する
      - name: パッケージを作って署名する
        shell: pwsh
        env:
          ZIPSIGN_PRIVATE_KEY: ${{ secrets.ZIPSIGN_PRIVATE_KEY }}
        run: |
          $name = "yeetdir-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/yeetdir.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/signing.key", [Convert]::FromBase64String($env:ZIPSIGN_PRIVATE_KEY))
          zipsign sign zip "$name.zip" "$env:RUNNER_TEMP/signing.key"
          zipsign verify zip "$name.zip" signing-public.key

      - name: GitHub Release を作る
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item *.zip) --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
