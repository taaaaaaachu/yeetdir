name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: タグと Cargo.toml の版が一致するか確認
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "タグ $env:GITHUB_REF_NAME と Cargo.toml の版 $version が一致しません" }

      - run: cargo test --locked
      - run: cargo build --release --locked

      - name: パッケージを作る
        shell: pwsh
        run: |
          $name = "yeetdir-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/yeetdir.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/$name.zip.sha256", "$hash  $name.zip`n") # sha256sum -c で読めるよう LF

      - name: GitHub Release を作る
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item *.zip, *.zip.sha256) --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
